<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Alganai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="min-h-screen bg-white">
    <div class="max-w-md mx-auto p-6">
        <!-- Logo (Added) -->
        <div class="absolute top-0 right-0 p-6">
            <img src="src/logo.png" alt="Alganai" class="h-8 md:h-10">
        </div>

        <!-- Back Button -->
        <a href="subscription.html" class="inline-block mb-12">
            <i class="fas fa-arrow-left text-[#112952] text-xl"></i>
        </a>

        <h1 class="text-[#112952] text-2xl font-bold text-center mb-12">Complete Subscription Payment</h1>
        
        <form id="paymentForm" class="space-y-6">
            <!-- Payment Method -->
            <div class="space-y-3">
                <label class="block text-sm text-[#112952]">Payment Method :</label>
                <div class="flex gap-4">
                    <div class="payment-method flex-1 border border-gray-200 rounded-xl p-4 flex items-center justify-center cursor-pointer hover:border-[#112952]" data-method="EDAHABIA">
                        <img src="src/edahabia-logo.png" alt="E-Dahabia" class="h-8">
                    </div>
                    <div class="payment-method flex-1 border border-gray-200 rounded-xl p-4 flex items-center justify-center cursor-pointer hover:border-[#112952]" data-method="CIB">
                        <img src="src/cib-logo.png" alt="CIB" class="h-8">
                    </div>
                </div>
            </div>

            <!-- Card Number -->
            <div class="space-y-2">
                <label class="block text-sm text-[#112952]">Card Number :</label>
                <input 
                    type="text" 
                    placeholder="XXXX XXXX XXXX XXXX" 
                    class="w-full px-4 py-4 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-[#112952] text-[#112952]"
                    maxlength="19"
                >
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Expiration Date -->
                <div class="space-y-2">
                    <label class="block text-sm text-[#112952]">Expiration date</label>
                    <input 
                        type="text" 
                        placeholder="MM/AA" 
                        class="w-full px-4 py-4 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-[#112952] text-[#112952]"
                        maxlength="5"
                    >
                </div>

                <!-- CVC -->
                <div class="space-y-2">
                    <label class="block text-sm text-[#112952]">CVC</label>
                    <input 
                        type="text" 
                        placeholder="XXX" 
                        class="w-full px-4 py-4 bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-[#112952] text-[#112952]"
                        maxlength="3"
                    >
                </div>
            </div>

            <!-- Confirm Payment Button -->
            <button 
                type="submit" 
                id="payButton"
                class="w-full bg-[#112952] text-white py-4 rounded-xl text-lg font-medium hover:bg-[#1a3666] transition-colors duration-300 mt-8"
            >
                Confirm payment
            </button>

            <!-- Security Note -->
            <p class="text-center text-sm text-gray-500 flex items-center justify-center gap-2">
                <i class="fas fa-lock"></i>
                Payment secured via Chargily Pay
            </p>
        </form>
    </div>

    <script>
        // Chargily Test Mode Configuration
        const CHARGILY_PUBLIC_KEY = 'test_pk_scaJ6imWtLajRVCZ65MXQYkI8Gf0nGquCtdx2WLI';
        const CHARGILY_SECRET_KEY = 'test_sk_sqTcHMNHB5XnFsR66d70iPK7kk9UfybehTCJ8GRi';
        
        // Payment configuration
        const paymentConfig = {
            amount: 2500, // Amount in DZD (Pro plan)
            currency: 'DZD',
            client_name: sessionStorage.getItem('fullName') || 'Client Name',
            client_email: sessionStorage.getItem('email') || 'client@email.com',
            mode: 'EDAHABIA', // Default payment mode
            back_url: window.location.origin + '/subscription.html',
            webhook_url: 'https://your-backend-url/webhook', // Your webhook URL to handle payment notifications
            app_name: 'Alganai'
        };

        // Handle payment method selection
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', function() {
                // Remove active state from all methods
                document.querySelectorAll('.payment-method').forEach(m => 
                    m.classList.remove('border-[#112952]', 'border-2'));
                
                // Add active state to selected method
                this.classList.add('border-[#112952]', 'border-2');
                paymentConfig.mode = this.dataset.method;
            });
        });

        // Handle form submission
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payButton = document.getElementById('payButton');
            payButton.disabled = true;
            payButton.innerHTML = 'Processing...';

            try {
                // Create payment request
                const response = await fetch('https://pay.chargily.net/test/api/v2/payments', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CHARGILY_PUBLIC_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(paymentConfig)
                });

                const data = await response.json();

                if (data.checkout_url) {
                    // Redirect to Chargily payment page
                    window.location.href = data.checkout_url;
                } else {
                    throw new Error('Payment initialization failed');
                }
            } catch (error) {
                console.error('Payment error:', error);
                alert('Payment initialization failed. Please try again.');
                payButton.disabled = false;
                payButton.innerHTML = 'Confirm payment';
            }
        });

        // Format card number input with spaces
        document.querySelector('input[placeholder="XXXX XXXX XXXX XXXX"]').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            if (value.length > 0) {
                value = value.match(new RegExp('.{1,4}', 'g')).join(' ');
            }
            e.target.value = value;
        });

        // Format expiration date input
        document.querySelector('input[placeholder="MM/AA"]').addEventListener('input', function(e) {
            let value = e.target.value.replace('/', '');
            if (value.length > 2) {
                value = value.slice(0, 2) + '/' + value.slice(2);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
