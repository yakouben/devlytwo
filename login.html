<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alganai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Add Supabase CDN before your scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#001F3F',
                        'navy-light': '#003366',
                        primary: '#A8C8FF',
                    },
                    boxShadow: {
                        'inner-custom': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary/20 to-white font-sans">
    <!-- Background Pattern -->
    <div class="fixed inset-0 bg-white bg-opacity-70 backdrop-blur-xl z-0"></div>
    
    <!-- Main Content -->
    <div class="relative min-h-screen flex items-center justify-center p-4">
        <!-- Login Card -->
        <div class="w-full max-w-md">
            <!-- Logo and Card Header -->
            <div class="text-center mb-8">
                <img src="src/logo.png" alt="Alganai" class="h-12 md:h-14 mx-auto mb-6">
                <h1 class="text-3xl font-bold text-navy">Welcome Back</h1>
                <p class="mt-2 text-gray-600">Enter your credentials to access your account</p>
            </div>

            <!-- Login Form -->
            <div class="bg-white rounded-2xl shadow-lg shadow-primary/10 p-8 space-y-6 border border-gray-100">
                <form id="loginForm" class="space-y-5">
                    <!-- Email Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input 
                                type="email" 
                                id="email"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter your email"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input 
                                type="password" 
                                id="password"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter your password"
                            >
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="rounded border-gray-300 text-navy focus:ring-primary">
                            <span class="text-sm text-gray-600">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-navy hover:text-navy-light transition-colors">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit"
                        class="w-full bg-navy text-white py-3 rounded-xl hover:bg-navy-light focus:ring-4 focus:ring-primary/50 transition-all duration-200 font-medium flex items-center justify-center space-x-2 group"
                    >
                        <span>Sign In</span>
                        <i class="fas fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="h-5 w-5 mr-2">
                        <span class="text-sm font-medium text-gray-600">Google</span>
                    </button>
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="h-5 w-5 mr-2">
                        <span class="text-sm font-medium text-gray-600">Facebook</span>
                    </button>
                </div>
            </div>

            <!-- Sign Up Link -->
            <p class="mt-6 text-center text-gray-600">
                Don't have an account? 
                <a href="role.html" class="text-navy font-medium hover:text-navy-light transition-colors">Sign up</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';
        
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitButton = loginForm.querySelector('button[type="submit"]');
            const buttonContent = submitButton.innerHTML;

            try {
                // Show loading state
                submitButton.innerHTML = '<span>Signing in...</span>';
                submitButton.disabled = true;

                // Sign in with Supabase Auth
                const { data: { user }, error: signInError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (signInError) throw signInError;

                // Get user type
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .select('user_type')
                    .eq('id', user.id)
                    .single();

                if (userError) throw userError;

                // Simple redirect based on user type
                if (userData.user_type === 'seeker') {
                    window.location.href = '/seeker-home.html';
                } else if (userData.user_type === 'employer') {
                    window.location.href = '/employer-home.html';
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Login failed: ' + error.message);
                
                // Reset button state
                submitButton.innerHTML = buttonContent;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
