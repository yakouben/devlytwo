<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Sign Up - Alganai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#001F3F',
                        'navy-light': '#003366',
                        primary: '#A8C8FF',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary/20 to-white font-sans">
    <!-- Background Pattern -->
    <div class="fixed inset-0 bg-white bg-opacity-70 backdrop-blur-xl z-0"></div>
    
    <!-- Main Content -->
    <div class="relative min-h-screen flex items-center justify-center p-4">
        <!-- Signup Card -->
        <div class="w-full max-w-md">
            <!-- Logo and Card Header -->
            <div class="text-center mb-8">
                <img src="src/logo.png" alt="Alganai" class="h-12 md:h-14 mx-auto mb-6">
                <h1 class="text-3xl font-bold text-navy">Create Business Account</h1>
                <p class="mt-2 text-gray-600">Join as an employer to find the best talent</p>
            </div>

            <!-- Signup Form -->
            <div class="bg-white rounded-2xl shadow-lg shadow-primary/10 p-8 space-y-6 border border-gray-100">
                <form id="signupForm" class="space-y-5">
                    <!-- Owner Name Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Owner Name*</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input 
                                type="text" 
                                id="fullName"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter owner's full name"
                            >
                        </div>
                    </div>

                    <!-- Company Name Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Company Name*</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-building text-gray-400"></i>
                            </div>
                            <input 
                                type="text" 
                                id="companyName"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter company name"
                            >
                        </div>
                    </div>

                    <!-- Phone Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Phone Number*</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-phone text-gray-400"></i>
                            </div>
                            <input 
                                type="tel" 
                                id="phone"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter phone number"
                            >
                        </div>
                    </div>

                    <!-- Email Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Email*</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input 
                                type="email" 
                                id="email"
                                required
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Enter business email"
                            >
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-gray-700">Password*</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input 
                                type="password" 
                                id="password"
                                required
                                minlength="6"
                                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all duration-200 bg-gray-50/30"
                                placeholder="Create a password"
                            >
                        </div>
                        <p class="text-xs text-gray-500">Must be at least 6 characters long</p>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="flex items-start space-x-3">
                        <input type="checkbox" required class="mt-1 rounded border-gray-300 text-navy focus:ring-primary">
                        <span class="text-sm text-gray-600">
                            I agree to the 
                            <a href="#" class="text-navy hover:text-navy-light">Terms of Service</a> 
                            and 
                            <a href="#" class="text-navy hover:text-navy-light">Privacy Policy</a>
                        </span>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit"
                        class="w-full bg-navy text-white py-3 rounded-xl hover:bg-navy-light focus:ring-4 focus:ring-primary/50 transition-all duration-200 font-medium flex items-center justify-center space-x-2 group"
                    >
                        <span>Create Business Account</span>
                        <i class="fas fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                    </button>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="fixed top-4 right-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-xl hidden" role="alert">
                    <p class="font-medium">Account created successfully!</p>
                    <p class="text-sm">Redirecting to login...</p>
                </div>
            </div>

            <!-- Sign In Link -->
            <p class="mt-6 text-center text-gray-600">
                Already have an account? 
                <a href="login.html" class="text-navy font-medium hover:text-navy-light transition-colors">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Keep your existing script -->
    <script type="module">
        import { supabase } from './supabase.js';
        
        const signupForm = document.getElementById('signupForm');
        const successMessage = document.getElementById('successMessage');
        
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitButton = signupForm.querySelector('button[type="submit"]');
            const buttonContent = submitButton.innerHTML;
            
            try {
                submitButton.innerHTML = '<span>Creating Account...</span>';
                submitButton.disabled = true;

                const fullName = document.getElementById('fullName').value;
                const companyName = document.getElementById('companyName').value;
                const phone = document.getElementById('phone').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Check if email already exists
                const { data: existingUser } = await supabase
                    .from('users')
                    .select('email')
                    .eq('email', email)
                    .single();

                if (existingUser) {
                    throw new Error('An account with this email already exists. Please login or use a different email.');
                }

                // 1. Sign up with Supabase Auth
                const { data: { user }, error: authError } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            user_type: 'employer'
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Create user profile in users table
                const { error: userError } = await supabase
                    .from('users')
                    .insert({
                        id: user.id,
                        email: email,
                        full_name: fullName,
                        phone: phone,
                        user_type: 'employer',
                        created_at: new Date(),
                        last_login: new Date()
                    });

                if (userError) throw userError;

                // 3. Create company profile
                const { error: companyError } = await supabase
                    .from('companies')
                    .insert({
                        user_id: user.id,
                        company_name: companyName,
                        created_at: new Date()
                    });

                if (companyError) throw companyError;

                // Show success message
                successMessage.classList.remove('hidden');
                
                // Wait for 2 seconds before redirecting
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Redirect to login page
                window.location.href = 'login.html';

            } catch (error) {
                console.error('Error:', error);
                
                // Show user-friendly error message
                if (error.message.includes('email already exists')) {
                    alert('This email is already registered. Please login or use a different email address.');
                } else {
                    alert('Signup failed: ' + error.message);
                }
                
                // Reset button to original state
                submitButton.innerHTML = buttonContent;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
